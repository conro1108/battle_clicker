<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#7a5237" />

    <link rel="icon" type="image/png" href="/icon-60.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Not black-translucent. Translucent makes the web view full-screen and
         hands the status bar's height back as a safe-area inset, and any
         mismatch between that inset and the viewport height the shell is sized
         against pushes the bottom nav off a screen that deliberately can't
         scroll. Opaque keeps the view below the bar and the insets at zero. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Potatoes, Inc." />

    <title>Potatoes, Inc.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
